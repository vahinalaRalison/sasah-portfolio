name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io
  # GHCR exige des noms d'images en minuscules (le compte contient une majuscule).
  IMAGE_PREFIX: ghcr.io/vahinalaralison/sasah-portfolio

permissions:
  contents: read
  packages: write

jobs:
  # ───────────── 1. Qualité : lint + typecheck + tests, un job par brique ─────────────
  test:
    name: Test ${{ matrix.project }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project:
          - services/profile-service
          - services/projects-service
          - services/contact-service
          - frontend
    defaults:
      run:
        working-directory: ${{ matrix.project }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ${{ matrix.project }}/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test

  # ───────────── 2. Images Docker → GitHub Container Registry ─────────────
  build:
    name: Build ${{ matrix.image.name }}
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        image:
          - { name: profile-service,  context: services/profile-service }
          - { name: projects-service, context: services/projects-service }
          - { name: contact-service,  context: services/contact-service }
          - { name: gateway,          context: gateway }
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ env.IMAGE_PREFIX }}/${{ matrix.image.name }}
          tags: |
            type=sha,prefix=
            type=raw,value=latest
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.image.context }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ───────────── 3. Front → Firebase Hosting (gratuit) ─────────────
  deploy-frontend:
    name: Deploy frontend (Firebase)
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      # Tant que les secrets Firebase ne sont pas créés, le job est ignoré sans échouer.
      # (pas de working-directory par défaut : cette étape tourne avant le checkout)
      - id: secrets
        run: echo "ready=${{ secrets.FIREBASE_SERVICE_ACCOUNT != '' && secrets.FIREBASE_PROJECT_ID != '' }}" >> "$GITHUB_OUTPUT"
      - if: steps.secrets.outputs.ready != 'true'
        run: echo "::notice::Secrets FIREBASE_SERVICE_ACCOUNT / FIREBASE_PROJECT_ID absents, déploiement Firebase ignoré."
      - uses: actions/checkout@v4
        if: steps.secrets.outputs.ready == 'true'
      - uses: actions/setup-node@v4
        if: steps.secrets.outputs.ready == 'true'
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        if: steps.secrets.outputs.ready == 'true'
        working-directory: frontend
      - run: npm run build
        if: steps.secrets.outputs.ready == 'true'
        working-directory: frontend
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
          # Mode sans serveur : config web Firebase (JSON) → données Firestore, admin Firebase Auth.
          VITE_FIREBASE_CONFIG: ${{ secrets.VITE_FIREBASE_CONFIG }}
      - name: Deploy Firestore rules
        if: steps.secrets.outputs.ready == 'true' && secrets.VITE_FIREBASE_CONFIG != ''
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          echo "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/sa.json"
          GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa.json" npx --yes firebase-tools@14 deploy --only firestore:rules --project "${{ secrets.FIREBASE_PROJECT_ID }}" --non-interactive
      - uses: FirebaseExtended/action-hosting-deploy@v0
        if: steps.secrets.outputs.ready == 'true'
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: ${{ secrets.FIREBASE_PROJECT_ID }}
          channelId: live
          entryPoint: .

  # ───────────── 4. API → serveur Docker (SSH) ─────────────
  deploy-api:
    name: Deploy API (serveur)
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      # Tant que les secrets DEPLOY_* ne sont pas créés, le job est ignoré sans échouer (voir DEPLOY.md).
      - id: secrets
        run: echo "ready=${{ secrets.DEPLOY_HOST != '' && secrets.DEPLOY_USER != '' && secrets.DEPLOY_SSH_KEY != '' && secrets.DEPLOY_PATH != '' }}" >> "$GITHUB_OUTPUT"
      - if: steps.secrets.outputs.ready != 'true'
        run: echo "::notice::Secrets DEPLOY_HOST / DEPLOY_USER / DEPLOY_SSH_KEY / DEPLOY_PATH absents, déploiement serveur ignoré."
      - uses: appleboy/ssh-action@v1.2.0
        if: steps.secrets.outputs.ready == 'true'
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script_stop: true
          script: |
            cd "${{ secrets.DEPLOY_PATH }}"
            curl -fsSLo docker-compose.api.yml https://raw.githubusercontent.com/${{ github.repository }}/${{ github.sha }}/docker-compose.api.yml
            IMAGE_TAG=${{ github.sha }} docker compose -f docker-compose.api.yml pull
            IMAGE_TAG=${{ github.sha }} docker compose -f docker-compose.api.yml up -d --remove-orphans
            docker image prune -f
            curl -fsS http://127.0.0.1:${GATEWAY_PORT_LOCAL:-8081}/api/profile/health

  # ───────────── 5. API → Kubernetes ─────────────
  deploy-k8s:
    name: Deploy API (Kubernetes)
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      # Tant que KUBE_CONFIG n'est pas créé, le job est ignoré sans échouer.
      - id: secrets
        run: echo "ready=${{ secrets.KUBE_CONFIG != '' }}" >> "$GITHUB_OUTPUT"
      - if: steps.secrets.outputs.ready != 'true'
        run: echo "::notice::Secret KUBE_CONFIG absent, déploiement Kubernetes ignoré."
      - uses: actions/checkout@v4
        if: steps.secrets.outputs.ready == 'true'
      - uses: azure/setup-kubectl@v4
        if: steps.secrets.outputs.ready == 'true'
      - name: Configure kubeconfig
        if: steps.secrets.outputs.ready == 'true'
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBE_CONFIG }}" | base64 -d > ~/.kube/config
          chmod 600 ~/.kube/config
      - name: Pin image tags to this commit
        if: steps.secrets.outputs.ready == 'true'
        working-directory: infra/k8s/overlays/prod
        run: |
          for img in profile-service projects-service contact-service gateway; do
            kustomize edit set image "$img=${IMAGE_PREFIX}/${img}:${GITHUB_SHA}"
          done
      - run: kubectl apply -k infra/k8s/overlays/prod
        if: steps.secrets.outputs.ready == 'true'
      - if: steps.secrets.outputs.ready == 'true'
        run: |
          for d in profile-service projects-service contact-service gateway; do
            kubectl -n sasah rollout status deployment/$d --timeout=180s
          done
