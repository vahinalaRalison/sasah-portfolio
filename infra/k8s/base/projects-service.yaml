apiVersion: apps/v1
kind: Deployment
metadata:
  name: projects-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: projects-service
  template:
    metadata:
      labels:
        app: projects-service
    spec:
      containers:
        - name: projects-service
          image: projects-service
          ports:
            - containerPort: 3002
          env:
            - name: PORT
              value: "3002"
            - name: CORS_ORIGIN
              valueFrom:
                configMapKeyRef: { name: sasah-config, key: CORS_ORIGIN }
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef: { name: service-databases, key: PROJECTS_DATABASE_URL }
          readinessProbe:
            httpGet: { path: /api/projects/health, port: 3002 }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /api/projects/health, port: 3002 }
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests: { cpu: 25m, memory: 64Mi }
            limits: { cpu: 250m, memory: 192Mi }
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
---
apiVersion: v1
kind: Service
metadata:
  name: projects-service
spec:
  selector:
    app: projects-service
  ports:
    - port: 3002
      targetPort: 3002
