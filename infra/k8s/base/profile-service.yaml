apiVersion: apps/v1
kind: Deployment
metadata:
  name: profile-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: profile-service
  template:
    metadata:
      labels:
        app: profile-service
    spec:
      containers:
        - name: profile-service
          image: profile-service
          ports:
            - containerPort: 3001
          env:
            - name: PORT
              value: "3001"
            - name: CORS_ORIGIN
              valueFrom:
                configMapKeyRef: { name: sasah-config, key: CORS_ORIGIN }
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef: { name: service-databases, key: PROFILE_DATABASE_URL }
            - name: ADMIN_PASSWORD
              valueFrom:
                secretKeyRef: { name: admin-credentials, key: ADMIN_PASSWORD, optional: true }
            - name: ADMIN_SECRET
              valueFrom:
                secretKeyRef: { name: admin-credentials, key: ADMIN_SECRET, optional: true }
          readinessProbe:
            httpGet: { path: /api/profile/health, port: 3001 }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /api/profile/health, port: 3001 }
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests: { cpu: 25m, memory: 64Mi }
            limits: { cpu: 250m, memory: 192Mi }
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
---
apiVersion: v1
kind: Service
metadata:
  name: profile-service
spec:
  selector:
    app: profile-service
  ports:
    - port: 3001
      targetPort: 3001
